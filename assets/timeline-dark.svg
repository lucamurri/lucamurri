<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Shipping log 2026: HomeDef, Pharma Access Atlas and Case Interview Engine milestones">
  <title>Shipping log 2026: HomeDef, Pharma Access Atlas and Case Interview Engine milestones</title>
  <style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
