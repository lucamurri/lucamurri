    <path class="k3" d="M790.0,250.0 H813.1 V235.8 H845.1 V218.0 H871.8 V204.7 H910.9 V187.5 H944.7 V174.5 H958.2 V169.8 H977.7 V163.3 H988.4 V160.0 H1013.3 V152.7 H1029.3 V148.4 H1050.6 V143.0 H1063.1 V140.0 H1091.5 V133.8 H1109.3 V130.2 H1110.0" fill="none" stroke="#3fb950" stroke-width="3.2" stroke-linejoin="round"/>
