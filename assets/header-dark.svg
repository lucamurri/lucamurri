      <g class="caret" transform="translate(604.8,0)"><rect class="blink" x="3" y="-21" width="11" height="26" rx="1.5" fill="#f47c7c"/></g>
    </g>
    <g class="p2" opacity="0">
      <clipPath id="c2"><rect class="clip" x="0" y="-30" width="522.4" height="44"/></clipPath>
      <text class="mono" x="0" y="0" textLength="518.4" font-size="24" fill="#e6edf3" clip-path="url(#c2)">Strategy · Product · Healthcare · AI</text>
      <g class="caret" transform="translate(518.4,0)"><rect class="blink" x="3" y="-21" width="11" height="26" rx="1.5" fill="#f47c7c"/></g>
    </g>
  </g>

