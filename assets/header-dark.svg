<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">Luca Murri</title>
  <desc id="d">Master in Management, Chicago Booth, Class of 2027. Business strategist who builds. Animated chart of time to drug access in France, Germany, England and Italy.</desc>
  <style>
  .serif { font-family: Charter, 'Iowan Old Style', Georgia, Cambria, 'Times New Roman', serif; }
  .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .eyebrow { animation: fade .7s ease-out .1s both; }
  .name { animation: fade .8s ease-out .25s both; }
  .rule { transform-origin: 64px 0; animation: grow .9s cubic-bezier(.3,.7,.2,1) .6s both; }
  .blink { animation: blink 1.05s linear infinite; }
  @keyframes show0 { 0% {opacity:1} 30.33% {opacity:1} 33.32% {opacity:0} 100% {opacity:0} }
  @keyframes wipe0 { 0% {transform:scaleX(0); animation-timing-function:steps(31,end)} 12.67% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
  @keyframes caret0 { 0% {transform:translateX(0px); animation-timing-function:steps(31,end)} 12.67% {transform:translateX(446.4px)} 100% {transform:translateX(446.4px)} }
  .p0 { animation: show0 15.0s linear 0s infinite; }
  .p0 .clip { animation: wipe0 15.0s linear 0s infinite; }
  .p0 .caret { animation: caret0 15.0s linear 0s infinite; }
  @keyframes show1 { 0% {opacity:1} 30.33% {opacity:1} 33.32% {opacity:0} 100% {opacity:0} }
  @keyframes wipe1 { 0% {transform:scaleX(0); animation-timing-function:steps(42,end)} 12.67% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
  @keyframes caret1 { 0% {transform:translateX(0px); animation-timing-function:steps(42,end)} 12.67% {transform:translateX(604.8px)} 100% {transform:translateX(604.8px)} }
  .p1 { animation: show1 15.0s linear -10.0s infinite; }
  .p1 .clip { animation: wipe1 15.0s linear -10.0s infinite; }
  .p1 .caret { animation: caret1 15.0s linear -10.0s infinite; }
  @keyframes show2 { 0% {opacity:1} 30.33% {opacity:1} 33.32% {opacity:0} 100% {opacity:0} }
  @keyframes wipe2 { 0% {transform:scaleX(0); animation-timing-function:steps(36,end)} 12.67% {transform:scaleX(1)} 100% {transform:scaleX(1)} }
  @keyframes caret2 { 0% {transform:translateX(0px); animation-timing-function:steps(36,end)} 12.67% {transform:translateX(518.4px)} 100% {transform:translateX(518.4px)} }
  .p2 { animation: show2 15.0s linear -5.0s infinite; }
  .p2 .clip { animation: wipe2 15.0s linear -5.0s infinite; }
  .p2 .caret { animation: caret2 15.0s linear -5.0s infinite; }
  .k0 { stroke-dasharray:480; stroke-dashoffset:480; animation: draw 2.4s cubic-bezier(.3,.7,.2,1) 0.50s both; }
  .l0 { animation: fade .6s ease-out 2.50s both; }
  .k1 { stroke-dasharray:480; stroke-dashoffset:480; animation: draw 2.4s cubic-bezier(.3,.7,.2,1) 0.85s both; }
  .l1 { animation: fade .6s ease-out 2.85s both; }
  .k2 { stroke-dasharray:456; stroke-dashoffset:456; animation: draw 2.4s cubic-bezier(.3,.7,.2,1) 1.20s both; }
  .l2 { animation: fade .6s ease-out 3.20s both; }
  .k3 { stroke-dasharray:440; stroke-dashoffset:440; animation: draw 2.4s cubic-bezier(.3,.7,.2,1) 1.55s both; }
  .l3 { animation: fade .6s ease-out 3.55s both; }
  @media (prefers-reduced-motion: reduce) {
    *, .clip, .caret, .blink { animation: none !important; }
    [class^="k"] { stroke-dashoffset: 0 !important; }
    .p1, .p2 { opacity: 0 !important; }
  }
  </style>

