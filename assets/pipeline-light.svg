<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="How I work: question, data, analysis, product, people">
  <title>How I work: question, data, analysis, product, people</title>
  <style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .serif { font-family: Charter, 'Iowan Old Style', Georgia, Cambria, 'Times New Roman', serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  @keyframes run { 0% { transform: translateX(0); opacity: 0; } 4% { opacity: 1; } 77.0% { opacity: 1; } 80.0%, 100% { transform: translateX(900.0px); opacity: 0; } }
  @keyframes glow { 0%, 100% { opacity: 0; } 4% { opacity: 1; } 30% { opacity: 0; } }
  .dot { animation: run 6.0s cubic-bezier(.45,.05,.55,.95) 1s infinite both; }
  .intro { animation: fade .6s ease-out both; }
  .g0 { animation: glow 6.0s ease-out 0.85s infinite both; }
