  .g1 { animation: glow 6.0s ease-out 2.05s infinite both; }
  .c1 { animation-delay: 0.22s; }
  .g2 { animation: glow 6.0s ease-out 3.25s infinite both; }
  .c2 { animation-delay: 0.34s; }
  .g3 { animation: glow 6.0s ease-out 4.45s infinite both; }
  .c3 { animation-delay: 0.46s; }
  .g4 { animation: glow 6.0s ease-out 5.65s infinite both; }
  .c4 { animation-delay: 0.58s; }
  </style>
